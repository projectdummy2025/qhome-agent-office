server {
    listen 80;
    server_name localhost;

    # Root directory for serving built files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for asset performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cegah browser melakukan caching pada index.html agar selalu mendapat kode terbaru
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SSE Stream endpoint optimization (Server-Sent Events)
    location ~ ^/api/projects/([^/]+)/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering and caching for real-time SSE stream delivery
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
        
        # Connection management for SSE
        proxy_set_header Connection "";
    }

    # General API routes reverse proxying
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTP Keep-Alive
        proxy_set_header Connection "";
    }

    # Aset statis dengan nama ber-hash (output Vite) — aman cache permanen
    location ~* \.(js|css)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gambar, font, ikon
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
